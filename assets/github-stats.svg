  </g>
  
      <g transform="translate(25, 54)">
        <text class="stat" x="0" y="12.5">Total de estrelas:</text>
        <text class="stat" x="310" y="12.5" text-anchor="end">0</text>
      </g>
      <g transform="translate(25, 78)">
