    .rank { font: 800 36px 'Segoe UI', Ubuntu, Sans-Serif; fill: #2cdcff; }
  </style>
  <rect width="495" height="195" rx="4.5" fill="#1a1b27" stroke="#2e344e"/>
  <g transform="translate(25, 35)">
