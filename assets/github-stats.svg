      </g>
      <g transform="translate(25, 102)">
        <text class="stat" x="0" y="12.5">Total de PRs:</text>
        <text class="stat" x="310" y="12.5" text-anchor="end">6</text>
      </g>
      <g transform="translate(25, 126)">
