name: Generate contribution snake

on:
  workflow_dispatch:
  schedule:
    - cron: "15 3 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate animated contribution graph
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: alexsandsouza
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-dark&color_snake=%2300E5FF
            dist/github-contribution-grid-snake-light.svg?palette=github-light&color_snake=%230089B2
      - name: Publish generated animations
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
